name: Deploy to GitHub Pages

on:
  push:
    branches: [kiraryuuki]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the artifact for absolute asset paths
        run: |
          set -eu
          if grep -rqE '(src|href)="/(assets|fonts|images)/' dist/index.html; then
            echo "::error::dist/index.html references absolute paths; they will 404 under /<repo>/"
            grep -oE '(src|href)="/[^"]*"' dist/index.html
            exit 1
          fi
          echo "asset paths are relative — good"

      - uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          includeHiddenFiles: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
